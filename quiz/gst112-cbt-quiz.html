<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST 112 — CBT Practice</title>
<style>
  :root{
    --indigo-deep:#131c33;
    --indigo:#1e2c4f;
    --indigo-line: rgba(233,225,204,0.18);
    --paper:#efe7d3;
    --paper-dim:#d9cfb2;
    --gold:#c9922e;
    --gold-bright:#e0ac48;
    --green:#2f8f5b;
    --brick:#b5482f;
    --ink:#171512;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--indigo-deep);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(224,172,72,0.10), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(47,143,91,0.10), transparent 45%);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .adire-band{
    height:10px;
    width:100%;
    background:
      repeating-linear-gradient(135deg,
        var(--gold) 0px, var(--gold) 2px,
        transparent 2px, transparent 14px),
      linear-gradient(90deg, var(--green), var(--indigo) 40%, var(--indigo) 60%, var(--brick));
    opacity:0.9;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:36px 20px 80px;
  }
  header.top{
    margin-bottom:28px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-bright);
    margin-bottom:8px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px,5vw,40px);
    margin:0 0 6px;
    line-height:1.05;
    color:var(--paper);
  }
  .sub{
    color:var(--paper-dim);
    font-size:14.5px;
    max-width:52ch;
  }

  /* Section picker screen */
  .section-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin-top:28px;
  }
  .section-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:linear-gradient(180deg, rgba(239,231,211,0.05), rgba(239,231,211,0.02));
    border:1px solid var(--indigo-line);
    border-radius:10px;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .15s ease, transform .15s ease, background .15s ease;
    text-align:left;
  }
  .section-card:hover{
    border-color:var(--gold);
    background:rgba(201,146,46,0.08);
    transform:translateY(-1px);
  }
  .section-card:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }
  .section-card .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--gold-bright);
    display:block;
    margin-bottom:4px;
  }
  .section-card .name{
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:600;
    color:var(--paper);
  }
  .section-card .meta{
    font-size:12.5px;
    color:var(--paper-dim);
    white-space:nowrap;
  }
  .section-card .score-pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    background:rgba(47,143,91,0.18);
    color:#9fe3bd;
    border:1px solid rgba(47,143,91,0.4);
    border-radius:20px;
    padding:3px 10px;
    white-space:nowrap;
  }

  .all-btn{
    margin-top:6px;
    background:var(--gold);
    color:var(--indigo-deep);
    border:none;
    border-radius:10px;
    padding:15px 18px;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:background .15s ease, transform .15s ease;
  }
  .all-btn:hover{ background:var(--gold-bright); transform:translateY(-1px); }

  /* Quiz screen */
  .quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
    gap:12px;
  }
  .back-link{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--paper-dim);
    background:none;
    border:none;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .back-link:hover{ color:var(--gold-bright); }

  .progress-track{
    height:5px;
    width:100%;
    background:rgba(239,231,211,0.12);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:6px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--green), var(--gold-bright));
    transition:width .25s ease;
  }
  .progress-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--paper-dim);
    display:flex;
    justify-content:space-between;
    margin-bottom:22px;
  }

  .card{
    background:rgba(239,231,211,0.04);
    border:1px solid var(--indigo-line);
    border-radius:14px;
    padding:26px 24px 22px;
  }
  .q-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--gold-bright);
    text-transform:uppercase;
    letter-spacing:0.1em;
    margin-bottom:10px;
  }
  .q-text{
    font-family:'Fraunces', serif;
    font-size:20px;
    line-height:1.35;
    font-weight:600;
    color:var(--paper);
    margin-bottom:20px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:flex-start;
    gap:12px;
    text-align:left;
    background:rgba(19,28,51,0.4);
    border:1px solid var(--indigo-line);
    border-radius:10px;
    padding:13px 15px;
    color:var(--paper);
    font-size:15px;
    line-height:1.4;
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .opt:hover:not(:disabled){
    border-color:var(--gold);
    background:rgba(201,146,46,0.1);
  }
  .opt:focus-visible{
    outline:2px solid var(--gold-bright);
    outline-offset:2px;
  }
  .opt .letter{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    width:22px;
    height:22px;
    min-width:22px;
    border-radius:50%;
    border:1px solid var(--indigo-line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--paper-dim);
  }
  .opt:disabled{ cursor:default; }
  .opt.correct{
    border-color:var(--green);
    background:rgba(47,143,91,0.18);
  }
  .opt.correct .letter{ border-color:var(--green); color:#9fe3bd; background:rgba(47,143,91,0.3); }
  .opt.incorrect{
    border-color:var(--brick);
    background:rgba(181,72,47,0.16);
  }
  .opt.incorrect .letter{ border-color:var(--brick); color:#f3b7a4; background:rgba(181,72,47,0.3); }
  .opt.dim{ opacity:0.45; }

  .feedback{
    margin-top:16px;
    font-size:13.5px;
    font-family:'IBM Plex Mono', monospace;
    min-height:18px;
  }
  .feedback.correct{ color:#9fe3bd; }
  .feedback.incorrect{ color:#f3b7a4; }

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .nav-btn{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    border-radius:9px;
    padding:11px 18px;
    cursor:pointer;
    border:1px solid var(--indigo-line);
    background:transparent;
    color:var(--paper);
    transition:border-color .12s ease, background .12s ease, opacity .12s ease;
  }
  .nav-btn:hover:not(:disabled){ border-color:var(--gold); background:rgba(201,146,46,0.08); }
  .nav-btn:disabled{ opacity:0.3; cursor:not-allowed; }
  .nav-btn.primary{
    background:var(--gold);
    color:var(--indigo-deep);
    border:none;
  }
  .nav-btn.primary:hover:not(:disabled){ background:var(--gold-bright); }

  .score-live{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--paper-dim);
  }

  /* Results screen */
  .result-card{
    text-align:center;
    padding:44px 24px;
  }
  .result-big{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:56px;
    background:linear-gradient(90deg, var(--gold-bright), #9fe3bd);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    line-height:1;
  }
  .result-sub{
    color:var(--paper-dim);
    font-size:14px;
    margin-top:10px;
  }
  .result-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-top:26px;
    flex-wrap:wrap;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="adire-band"></div>
<div class="wrap" id="app"></div>

uba) and decentralised/acephalous systems (e.g., Igbo)", "Entirely centralised under one king", "Entirely democratic in the modern sense", "Controlled by Europeans"], "correct": 0}, {"q": "The 1914 amalgamation of Nigeria was mainly motivated by:", "options": ["British administrative and economic convenience", "Nigerian nationalist demand", "A United Nations resolution", "Religious unification"], "correct": 0}, {"q": "Indirect rule's impact on Nigeria's political development was that it:", "options": ["Preserved traditional authority under British oversight, working unevenly across regions", "Abolished all traditional rulers", "Immediately gave Nigerians full self-government", "Had no political effect"], "correct": 0}, {"q": "Constitutional developments between 1922 and 1954 mainly:", "options": ["Gradually increased Nigerian representation and regional autonomy", "Ended colonial rule immediately", "Had no bearing on Nigerian unity", "Created a single unified currency only"], "correct": 0}, {"q": "The British colonial administrator central to the formation of Nigeria was:", "options": ["Lord Frederick Lugard", "Cecil Rhodes", "Winston Churchill", "Lord Macaulay"], "correct": 0}, {"q": "The Colony and Protectorate of Nigeria was established in:", "options": ["1914", "1900", "1960", "1922"], "correct": 0}, {"q": "The system of governance Lord Lugard introduced in Nigeria was:", "options": ["Indirect rule", "Direct rule", "Federalism", "Military rule"], "correct": 0}, {"q": "A major consequence of colonialism in Nigeria was:", "options": ["Disruption of indigenous systems alongside new administrative, economic, and educational structures", "Complete cultural preservation", "Immediate industrialisation", "No change to governance"], "correct": 0}, {"q": "The nationalist movement that emerged in Nigeria in the 1940s–50s was the:", "options": ["NCNC (National Council of Nigeria and the Cameroons)", "ECOWAS", "African Union", "OPEC"], "correct": 0}, {"q": "Nigeria gained in  defined as:", "options": ["The exchange of goods and services between parties", "The production of goods only", "Government taxation", "Currency printing"], "correct": 0}, {"q": "Types of trade include:", "options": ["Local (home) trade and international (foreign) trade", "Only barter trade", "Only online trade", "Only export trade"], "correct": 0}, {"q": "The main benefit of trade is:", "options": ["It allows access to goods/services not locally available and boosts economic growth", "It reduces the variety of goods available", "It isolates economies", "It has no economic benefit"], "correct": 0}, {"q": "A trade barrier is:", "options": ["A restriction (e.g., tariff, quota) that limits international trade", "A type of currency", "A trade agreement with no limits", "A form of transportation"], "correct": 0}, {"q": "The term for trade between countries is:", "options": ["International (foreign) trade", "Domestic trade", "Barter trade", "Retail trade"], "correct": 0}, {"q": "Economic self-reliance means:", "options": ["A nation's ability to meet its needs using its own resources with minimal external dependence", "Total isolation from world trade", "Dependence on foreign aid", "Complete reliance on imports"], "correct": 0}, {"q": "Self-reliance contributes to national development by:", "options": ["Reducing dependence on imports and strengthening local production", "Increasing foreign debt", "Weakening local industries", "Discouraging entrepreneurship"], "correct": 0}, {"q": "A strategy for achieving economic self-reliance in Nigeria includes:", "options": ["Promoting local industries and import substitution", "Increasing imports of finished goods", "Discouraging local manufacturing", "Relying solely on oil exports"], "correct": 0}, {"q": "A benefit of self-reliance in national development is:", "options": ["Greater economic stability and reduced vulnerability to external shocks", "Total economic collapse", "Increased foreign dependency", "No measurable benefit"], "c }, {"q": "Ethnicity has shaped Nigeria's political development by:", "options": ["Influencing political alliances, power struggles, and regional politics", "Playing no role in politics", "Uniting all parties equally", "Being irrelevant to elections"], "correct": 0}, {"q": "Governance failures have undermined national integration in Nigeria mainly through:", "options": ["Corruption, marginalization, and unequal resource distribution", "Excellent service delivery", "Full ethnic equality", "Complete transparency"], "correct": 0}, {"q": "A practical strategy for strengthening nation building in Nigeria is:", "options": ["Promoting inclusive governance, equitable resource distribution, and civic education", "Increasing ethnic favoritism", "Reducing political participation", "Ignoring regional disparities"], "correct": 0}]}, {"title": "Section 6 — Law, Social Justice, and National Development", "questions": [{"q": "The supreme law of Nigeria is:", "options": ["The Nigerian Constitution", "The Penal Code", "Customary law", "Sharia law"], "correct": 0}, {"q": "A fundamental right enshrined in the Nigerian Constitution is:", "options": ["The right to life", "The right to a company car", "The right to free international travel", "The right to a government job"], "correct": 0}, {"q": "The commission responsible for investigating human rights abuses in Nigeria is the:", "options": ["National Human Rights Commission (NHRC)", "INEC", "EFCC", "NNPC"], "correct": 0}, {"q": "A major challenge to social justice in Nigeria is:", "options": ["Corruption and unequal access to justice", "Excess judicial funding", "Too many courts", "No legal challenges exist"], "correct": 0}, {"q": "The Sustainable Development Goals (SDGs) initiative aims to:", "options": ["Promote national and global development through targets like poverty reduction and education", "Focus only on military development", "Eliminate all national laws", "Restrict trade"], "correct": 0}, {"q": "A key characteristic of law is that it is:", "options": ["Normative, general, and binding on members of society", "Optional to follow", "Only applicable to government officials", "Unwritten and informal"], "correct": 0}, {"q": "A feature of law is that it:", "options": ["Is enforced by recognized authority and applies generally", "Applies to no one", "Is created without any authority", "Cannot be changed"], "correct": 0}, {"q": "For law to be \"normative\" means it:", "options": ["Sets standards or rules for expected behaviour in society", "Has no standards", "Applies only to criminals", "Is purely descriptive, not prescriptive"], "correct": 0}, {"q": "The characteristic that ensures law applies equally to all members of society is:", "options": ["Universality (equality before the law)", "Selectivity", "Favoritism", "Optionality"], "correct": 0}, {"q": "The \"coercive nature\" of law means:", "options": ["It can be enforced through sanctions or penalties for non-compliance", "It is entirely voluntary", "It has no consequences", "It only applies to businesses"], "correct": 0}, {"q": "A primary function of law in society is to:", "options": ["Maintain order and regulate behaviour", "Increase chaos", "Eliminate government", "Prevent all trade"], "correct": 0}, {"q": "Functions of law include:", "options": ["Maintaining order, resolving disputes, and protecting rights", "Only generating revenue", "Only punishing citizens", "Only benefiting the government"], "correct": 0}, {"q": "The dispute resolution function of law is to:", "options": ["Provide a fair, structured process for settling conflicts", "Encourage conflict", "Ignore disagreements", "Replace all courts"], "correct": 0}, {"q": "Law contributes to economic development by:", "options": ["Providing a stable legal framework for business, contracts, and property rights", "Discouraging all investment", "Banning trade", "Having no economic relevance"], "correct": 0}, {"q": "The two main classifications of law are:", "options": ["Public law and Private law", "Written law and unwritten law only", "Federal law and state law only", "Criminal law only"], "correct": 0}, {"q": "An example of Public Law is:", "options": ["Constitutional law", "Contract law", "Law of torts", "Property law between individuals"], "correct": 0}, {"q": "The type of law that governs crimes like murder, theft, and assault is:", "options": ["Criminal law", "Contract law", "Family law", "Property law"], "correct": 0}, {"q": "The type of law that deals with family matters like divorce and child custody is:", "options": ["Family law", "Criminal law", "Constitutional law", "Company law"], "correct": 0}]}, {"title": "Section 7 — Norms, Values, and Social Challenges in Nigeria", "questions": [{"q": "A common greeting norm in Nigeria is:", "options": ["Prostrating or kneeling to greet elders, depending on culture", "Ignoring elders", "Shouting greetings from a distance", "No greeting customs exist"], "correct": 0}, {"q": "Older people in Nigeria are generally addressed with:", "options": ["Respectful titles (e.g., \"Sir,\" \"Ma,\" \"Baba,\" \"Mama\")", "First names only, casually", "No particular respect", "Nicknames only"], "correct": 0}, {"q": "A common eating etiquette in Nigeria is:", "options": ["Washing hands before eating, and using the right hand to eat traditional meals", "Eating standing on furniture", "No etiquette exists", "Eating only with the left hand"], "correct": 0}, {"q": "Public dressing in Nigerian communities generally reflects:", "options": ["A blend of modesty, traditional attire, and modern fashion, depending on context", "No dress norms", "Uniform dress nationwide", "Only Western clothing"], "correct": 0}, {"q": "The best way to show respect in many Nigerian communities is:", "options": ["Through polite speech, deference to elders, and proper greetings", "Ignoring social customs", "Avoiding all elders", "Speaking loudly to elders"], "correct": 0}, {"q": "Values can be defined as:", "options": ["Deeply held beliefs or principles that guide behaviour and judgment", "Random personal preferences with no influence", "Legal requirements only", "Physical possessions"], "correct": 0}, {"q": "An example of a value is:", "options": ["Honesty, respect, or hard work", "A car", "A house", "Money"], "correct": 0}, {"q": "Values are important in a community because they:", "options": ["Guide acceptable behaviour and foster social cohesion", "Have no social function", "Only matter to individuals", "Create division only"], "correct": 0}, {"q": "The value that emphasises respect for others is often called:", "options": ["Respect/courtesy", "Greed", "Individualism only", "Indifference"], "correct": 0}, {"q": "Values influence behaviour by:", "options": ["Shaping decisions, priorities, and how people treat others", "Having no effect on actions", "Only applying in private settings", "Being irrelevant to society"], "correct": 0}, {"q": "A major social challenge in Nigeria is:", "options": ["Corruption", "Excess prosperity", "Too much social equality", "Absence of any challenges"], "correct": 0}, {"q": "Social issues affecting many Nigerian communities include:", "options": ["Poverty, unemployment, and insecurity", "Excess infrastructure", "Overfunded public services", "No notable issues"], "correct": 0}, {"q": "A challenge facing education in Nigeria is:", "options": ["Inadequate funding and poor infrastructure", "Excess quality teachers", "Too many schools", "No challenges"], "correct": 0}, {"q": "A major health challenge in Nigeria is:", "options": ["Inadequate healthcare access and facilities", "Excess hospital funding", "Too many doctors", "No health issues"], "correct": 0}, {"q": "Corruption impacts Nigeria's development by:", "options": ["Diverting public resources and undermining institutions and growth", "Strengthening public trust", "Improving service delivery", "Having no economic effect"], "correct": 0}]}];

const state = {
  screen: 'home',       // 'home' | 'quiz' | 'result'
  sectionIndex: null,   // null = "all sections" combined run
  questions: [],        // active shuffled question set for this run
  current: 0,
  answered: [],          // per question: null | {chosenIdx, correct}
  sectionScores: JSON.parse(JSON.stringify(computeEmptyScores())),
};

function computeEmptyScores(){
  return DATA.map(s => ({attempted:0, correct:0, total:s.questions.length}));
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function letterFor(i){ return String.fromCharCode(65+i); }

function buildRunQuestions(sectionIdx){
  let list;
  if(sectionIdx === null){
    list = [];
    DATA.forEach((s, si) => s.questions.forEach((q, qi) => list.push({...q, _section:si, _qIndexInSection:qi, _sectionTitle:s.title})));
  } else {
    list = DATA[sectionIdx].questions.map((q,qi) => ({...q, _section:sectionIdx, _qIndexInSection:qi, _sectionTitle:DATA[sectionIdx].title}));
  }
  // shuffle option order per question, remember correct index
  return list.map(q => {
    const optObjs = q.options.map((text, idx) => ({text, isCorrect: idx === q.correct}));
    const shuffled = shuffle(optObjs);
    return {
      qText: q.q,
      section: q._section,
      sectionTitle: q._sectionTitle,
      options: shuffled,
      correctIdx: shuffled.findIndex(o => o.isCorrect),
    };
  });
}

function startRun(sectionIdx){
  state.screen = 'quiz';
  state.sectionIndex = sectionIdx;
  state.questions = shuffle(buildRunQuestions(sectionIdx));
  state.current = 0;
  state.answered = new Array(state.questions.length).fill(null);
  render();
}

function goHome(){
  state.screen = 'home';
  render();
}

function answer(optIdx){
  const q = state.questions[state.current];
  if(state.answered[state.current]) return;
  const correct = optIdx === q.correctIdx;
  state.answered[state.current] = {chosenIdx: optIdx, correct};
  const sc = state.sectionScores[q.section];
  sc.attempted += 1;
  if(correct) sc.correct += 1;
  render();
}

function nextQ(){
  if(state.current < state.questions.length - 1){
    state.current += 1;
    render();
  } else {
    state.screen = 'result';
    render();
  }
}
function prevQ(){
  if(state.current > 0){
    state.current -= 1;
    render();
  }
}

function retrySection(sectionIdx){
  startRun(sectionIdx);
}

function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(v === null || v === undefined) return;
    if(k === 'class') e.className = v;
    else if(k === 'html') e.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c === null || c === undefined) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function renderHome(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const header = el('header', {class:'top'}, [
    el('div', {class:'eyebrow'}, 'GST 112 · Nigerian Peoples and Culture'),
    el('h1', {}, 'CBT Practice'),
    el('div', {class:'sub'}, 'Pick a section to drill, or run the full 119-question set. Options are shuffled each attempt so you learn the answer, not the position.'),
  ]);
  app.appendChild(header);

  const grid = el('div', {class:'section-grid'});
  DATA.forEach((s, i) => {
    const sc = state.sectionScores[i];
    const pillText = sc.attempted > 0 ? `${sc.correct}/${sc.attempted}` : `${s.questions.length} Qs`;
    const card = el('button', {class:'section-card', onclick: ()=>startRun(i)}, [
      el('div', {}, [
        el('span', {class:'num'}, `Section ${i+1}`),
        el('span', {class:'name'}, s.title.replace(/^Section [A-Za-z]+ — /,'')),
      ]),
      el('span', {class: sc.attempted>0 ? 'score-pill' : 'meta'}, pillText),
    ]);
    grid.appendChild(card);
  });
  app.appendChild(grid);

  const totalQ = DATA.reduce((a,s)=>a+s.questions.length,0);
  app.appendChild(el('button', {class:'all-btn', onclick: ()=>startRun(null)}, `Run all ${totalQ} questions, mixed`));
}

function renderQuiz(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const q = state.questions[state.current];
  const ans = state.answered[state.current];
  const totalInRun = state.questions.length;
  const pct = Math.round(((state.current) / totalInRun) * 100);

  const qh = el('div', {class:'quiz-header'}, [
    el('button', {class:'back-link', onclick: goHome}, '← All sections'),
    el('span', {class:'score-live'}, '')
  ]);
  app.appendChild(qh);

  const answeredCount = state.answered.filter(Boolean).length;
  const correctCount = state.answered.filter(a=>a && a.correct).length;
  qh.querySelector('.score-live').textContent = `${correctCount} / ${answeredCount} correct so far`;

  app.appendChild(el('div', {class:'progress-track'}, [
    el('div', {class:'progress-fill', style:''}, [])
  ]));
  app.querySelector('.progress-fill').style.width = pct + '%';

  app.appendChild(el('div', {class:'progress-label'}, [
    el('span', {}, `Question ${state.current+1} of ${totalInRun}`),
    el('span', {}, q.sectionTitle.replace(/^Section [A-Za-z]+ — /,'')),
  ]));

  const card = el('div', {class:'card'});
  card.appendChild(el('div', {class:'q-eyebrow'}, `Question ${state.current+1}`));
  card.appendChild(el('div', {class:'q-text'}, q.qText));

  const optsWrap = el('div', {class:'options'});
  q.options.forEach((opt, idx) => {
    let cls = 'opt';
    if(ans){
      if(idx === q.correctIdx) cls += ' correct';
      else if(idx === ans.chosenIdx) cls += ' incorrect';
      else cls += ' dim';
    }
    const btn = el('button', {
      class: cls,
      disabled: ans ? 'disabled' : null,
      onclick: () => answer(idx),
    }, [
      el('span', {class:'letter'}, letterFor(idx)),
      el('span', {}, opt.text),
    ]);
    if(ans) btn.setAttribute('disabled','');
    optsWrap.appendChild(btn);
  });
  card.appendChild(optsWrap);

  const fb = el('div', {class:'feedback' + (ans ? (ans.correct ? ' correct' : ' incorrect') : '')},
    ans ? (ans.correct ? '✓ Correct.' : `✗ Not quite — correct answer highlighted above.`) : '');
  card.appendChild(fb);

  app.appendChild(card);

  const navRow = el('div', {class:'nav-row'}, [
    el('button', {class:'nav-btn', onclick: prevQ, disabled: state.current===0 ? 'disabled': null}, '← Previous'),
    el('button', {
      class:'nav-btn primary',
      onclick: nextQ,
      disabled: ans ? null : 'disabled',
    }, state.current === totalInRun-1 ? 'Finish' : 'Next →'),
  ]);
  if(state.current===0) navRow.children[0].setAttribute('disabled','');
  if(!ans) navRow.children[1].setAttribute('disabled','');
  app.appendChild(navRow);
}

function renderResult(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const correctCount = state.answered.filter(a=>a && a.correct).length;
  const total = state.questions.length;
  const pct = Math.round((correctCount/total)*100);

  const label = state.sectionIndex === null ? 'All sections' : DATA[state.sectionIndex].title.replace(/^Section [A-Za-z]+ — /,'');

  const card = el('div', {class:'card result-card'}, [
    el('div', {class:'q-eyebrow'}, label),
    el('div', {class:'result-big'}, `${correctCount}/${total}`),
    el('div', {class:'result-sub'}, `${pct}% correct`),
    el('div', {class:'result-actions'}, [
      el('button', {class:'nav-btn primary', onclick: ()=>retrySection(state.sectionIndex)}, 'Retry this set'),
      el('button', {class:'nav-btn', onclick: goHome}, 'Back to sections'),
    ]),
  ]);
  app.appendChild(card);
}

function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'quiz') renderQuiz();
  else renderResult();
}

render();
</script>
